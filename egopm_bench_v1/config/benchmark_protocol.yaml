contract_version: v1.0.0
config_version: v1.0.0
protocol_structure_version: v1.0.0
parameterization_status: pending_full_dataset_statistics
parameterization_gate: PROTOCOL_PARAMETERS_V1

track:
  name: Budgeted Online Track
  v1_input: official_event_text
  media_status: video_referenced_text_first
  history_access: no_raw_history_revisit
  future_access: forbidden
  candidate_decision_points_visible_to_model: false
  processing_order:
    - receive_current_observation
    - update_persistent_memory
    - emit_reminder_set_or_silence
  decision_frequency: every_event_arrival
  model_visible_event_fields: [virtual_time, visible_text]
  prohibited_model_input_fields: [event_role, rule_id, intention_state_before, intention_state_after, gold_action, evidence_sets]

memory:
  permitted_persistent_representations: [normalized_text, structured_json]
  prohibited_persistent_representations: [unmetered_vector_index, hidden_state]
  token_counter: tiktoken:cl100k_base
  counted: [history_summary, intention_ledger, evidence_cache, reminder_history, all_other_cross_step_text]
  not_counted: [model_parameters, current_observation, nonpersistent_current_step_workspace]
  candidate_budget_tokens: [256, 512, 1024, 2048]
  final_budget_tokens: null

reminder_policy:
  status: pending_full_dataset_statistics
  valid_window: seed_defined_and_oracle_checked
  cooldown_seconds: null
  maximum_reminders_per_intention: null
  required_terminal_silent_states: [completed, cancelled, expired, active_reminded]

oracle:
  gold_authority: deterministic_state_machine_only
  llm_may_set_gold: false
  states: [active_unreminded, active_reminded, completed, cancelled, expired]
  rule:
    trigger_false: silent
    inactive_or_terminal_state: silent
    outside_valid_window: silent
    active_unreminded_inside_window: remind

difficulties:
  short:
    event_count: [12, 20]
    background_intentions: [0, 1]
    virtual_span_minutes: [30, 90]
  medium:
    event_count: [35, 60]
    background_intentions: [2, 4]
    virtual_span_minutes: [120, 480]
  long:
    event_count: [90, 150]
    background_intentions: [5, 10]
    virtual_span_minutes: [720, 2880]

counterfactual:
  branches: [positive, negative]
  difficulties: [short, medium, long]
  negative_history_types: [never_created, completed, cancelled, expired, already_reminded]
  required_current_trigger_match: true
  required_gold_flip: true
  required_min_lures: 2
