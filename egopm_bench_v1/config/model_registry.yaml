contract_version: v1.1.0
config_version: v1.1.0
registry_version: v1.6.0
credential_environment_variable: DASHSCOPE_API_KEY
credential_policy: environment_only
raw_response_policy: forbidden
default_region: cn-beijing
default_endpoint: https://dashscope.aliyuncs.com/compatible-mode/v1

models:
  cue_v2_extraction:
    # Cue v2 的唯一当前配置；CLI 可显式覆盖，脚本不得另设路径默认值。
    model_id: qwen3.7-flash
    thinking_enabled: false
    reasoning_effort: none
    temperature: 0
    prompt_path: ../prompts/cue_extractor_v2.md
    inference_schema_path: ../schemas/cue_v2_inference.schema.json
    artifact_schema_path: ../schemas/cue_v2_artifacts.schema.json
    source_path: ../source/source_video_atoms.jsonl
    candidate_path: ../cues/v2/source_selection/bge_m3_source_select_v3_1_20260914_02/candidate_atoms.jsonl
    runs_root: ../cues/v2/runs
    maximum_atoms_per_request: 5
    dimension_operators:
      object: [present, held]
      activity: [starts, ongoing]
      state: [is, changes_to]
      location: [at]
    raw_response_policy: forbidden
    visible_text_evidence: forbidden
    reason_codes: [NO_OBSERVABLE_CONDITION, INSUFFICIENT_EVIDENCE, UNRESOLVED_REFERENT, AMBIGUOUS_PERSON_ROLE, AMBIGUOUS_SCOPE, AMBIGUOUS_TEMPORAL_MODALITY, UNSUPPORTED_RELATION, MULTIPLE_UNRELATED_FACTS, EXPLICIT_TIME_NOT_ENABLED]
  seed_generation:
    model_id: qwen3.7-plus-2026-05-26
    thinking_enabled: true
    reasoning_effort: medium
    temperature: 0
    prompt_version: seed_generator_v1
    schema: reminder_seed.schema.json
  seed_audit:
    # Seed 生成与审计统一使用同一 Plus 快照；审计仍以更高推理强度独立进行。
    model_id: qwen3.7-plus-2026-05-26
    thinking_enabled: true
    reasoning_effort: high
    temperature: 0
    prompt_version: seed_auditor_v1
    schema: reminder_seed.schema.json
  seed_retrieval:
    method: bge_m3_hybrid_rrf_v1
    model_id: BAAI/bge-m3
    model_revision: 5617a9f61b028005a4858fdac845db406aefb181
    dense_representation: cls
    max_input_tokens: 512
    channel_top_k: 64
    rrf_k: 60
    ranking_depth: 128
    use_fp16: false
    dense_normalization: l2
    dense_similarity: cpu_exact_inner_product
    sparse_similarity: dot_product
    ann: false
    reranker: null
    query_serialization_version: cue_query_v1
    passage_serialization_version: atom_passage_v1

run_manifest_required_fields:
  - run_id
  - model_id
  - region
  - endpoint
  - thinking_enabled
  - reasoning_effort
  - temperature
  - prompt_version
  - schema_version
  - request_time
  - input_atom_ids
  - raw_response_path
  - parse_status
  - retry_count
  - validation_errors
  - cue_execution_policy_version
  - cue_execution_protocol_sha256
  - cue_prompt_sha256
  - cue_inference_schema_sha256
  - source_atoms_sha256
  - package_maximum_atoms
  - package_maximum_request_utf8_bytes
  - output_tokens_per_atom
  - batch_task_id
  - batch_custom_id
  - batch_input_sha256
  - remote_file_id
  - remote_cleanup_status
  - package_count
  - usage_summary
