contract_version: v1.1.0
config_version: v1.1.0
registry_version: v1.4.0
credential_environment_variable: DASHSCOPE_API_KEY
credential_policy: environment_only
raw_response_policy: forbidden
default_region: cn-beijing
default_endpoint: https://dashscope.aliyuncs.com/compatible-mode/v1

models:
  cue_extraction:
    # Batch API 当前接受模型族基础别名；日期快照仅在实时接口可用。
    model_id: qwen3.7-flash
    thinking_enabled: false
    reasoning_effort: none
    temperature: 0
    prompt_version: cue_extractor_v3_compact
    schema: cue_candidate.schema.json
    schema_version: v1.0.0
    execution:
      cue_execution_policy_version: v2.2.1
      # 此版本标识协议哈希的 canonical payload 结构；结构变化必须拒绝恢复旧 shard。
      protocol_hash_payload_version: v2.0.0
      mode: explicit_batch_file_execute_only
      shard_size_atoms: 500
      max_retries: 2
      transport: batch_file
      package_policy:
        maximum_atoms: 5
        maximum_request_utf8_bytes: 24000
        ordering: atom_id_lexicographic
        output_tokens_per_atom: 96
        output_max_tokens_formula: output_tokens_per_atom_times_package_atom_count
        inference_schema: cue_inference_batch_compact_v1.schema.json
        inference_schema_version: v1.0.0
        response_top_level_field: items
        response_correlation_field: n
      controlled_field_policy:
        model_input_fields: [item_index, text]
        model_output_fields: [n, t, p, x, c, v, e, s, a, r]
        program_backfilled_fields: [cue_id, atom_id, split, source_text, model_id, prompt_version, schema_version, run_id]
        raw_model_response_storage: forbidden
      compact_inference_policy:
        cue_type_codes: {T: time, P: person, L: place, O: object, A: activity, S: state_change}
        operator_codes: {"=": eq, "!": not_eq, "+": present, "-": absent, "^": starts, "$": ends, "~": contains}
        required_fields: [n, t, p, x, c, v]
        optional_defaults: {e: [], s: null, a: null, r: null}
        confidence_scale: 100
      batch_file_policy:
        logical_shards_per_task: 10
        completion_window: 24h
        max_requests_per_file: 50000
        max_input_file_bytes: 500000000
        max_request_line_bytes: 1000000
        request_endpoint: /v1/chat/completions
        custom_id_format: v22_s{shard_index:05d}_p{package_index:03d}_{manifest_sha256_8}
        local_request_body_storage: temporary_delete_after_upload
        local_raw_result_storage: forbidden_stream_only
        remote_files_delete_after_cue_qa: required
        successful_local_validation_failure: quarantine_no_auto_retry
      batch_ledger_policy:
        required_fields: [batch_task_index, batch_custom_id, batch_input_sha256, remote_file_id, remote_cleanup_status, outcome]
        terminal_outcomes: [validated_success, service_line_failure_requeueable, local_validation_quarantine]
        require_single_terminal_outcome_per_custom_id: true
        prohibit_requeue_after_local_validation_quarantine: true
      batch_execution_policy:
        authorization_version: v1.0.0
        authorization_required: true
        wave_task_counts: [1, 10, 10, 10, 10, 10, 10, 14]
        max_submit_in_flight: 1
        completion_poll_initial_seconds: 30
        completion_poll_max_seconds: 300
        max_local_validation_quarantine_per_wave: 0
        remote_cleanup_gate: t4_cue_qa_done
        execution_state_filename: execution_state.json
      token_accounting:
        authoritative_source: response_usage
        input_field: prompt_tokens
        output_field: completion_tokens
        total_field: total_tokens
        preflight_upper_bound: serialized_utf8_batch_request_bytes
        raw_response_storage: forbidden
      pricing_snapshot:
        pricing_version: "2026-09-01_cn-beijing_batch_file_list"
        official_pricing_url: https://help.aliyun.com/zh/model-studio/model-pricing
        input_price_cny_per_million_tokens: 0.1
        output_price_cny_per_million_tokens: 0.4
        price_region: cn-beijing
        input_context_window_tokens: 32000
        successful_requests_only_billed: true
        context_cache_supported: false
      shard_layout:
        root: cues/batch
        batch_tasks_manifest: batch_tasks_manifest.jsonl
        package_directory: packages
        input_manifest_suffix: .input.jsonl
        output_suffix: .result.jsonl
        ledger_suffix: .ledger.jsonl
        completion_suffix: .complete.json
        failed_suffix: .failed.json
        batch_input_suffix: .batch.jsonl
        batch_manifest_suffix: .batch.json
        batch_receipt_suffix: .batch_receipt.json
        merge_order: numeric_shard_index_ascending
      recovery:
        require_matching_source_hash: true
        require_matching_protocol_hash: true
        rerun_only_incomplete_or_failed_packages: true
        completion_marker_requires_sha256: true
        require_batch_custom_id_bijection: true
        prohibit_automatic_local_validation_retry: true
  seed_generation:
    model_id: qwen3.7-plus-2026-05-26
    thinking_enabled: true
    reasoning_effort: medium
    temperature: 0
    prompt_version: seed_generator_v1
    schema: reminder_seed.schema.json
  seed_audit:
    model_id: qwen3.7-max-2026-06-08
    thinking_enabled: true
    reasoning_effort: high
    temperature: 0
    prompt_version: seed_auditor_v1
    schema: reminder_seed.schema.json

run_manifest_required_fields:
  - run_id
  - model_id
  - region
  - endpoint
  - thinking_enabled
  - reasoning_effort
  - temperature
  - prompt_version
  - schema_version
  - request_time
  - input_atom_ids
  - raw_response_path
  - parse_status
  - retry_count
  - validation_errors
  - cue_execution_policy_version
  - cue_execution_protocol_sha256
  - cue_prompt_sha256
  - cue_inference_schema_sha256
  - source_atoms_sha256
  - package_maximum_atoms
  - package_maximum_request_utf8_bytes
  - output_tokens_per_atom
  - batch_task_id
  - batch_custom_id
  - batch_input_sha256
  - remote_file_id
  - remote_cleanup_status
  - package_count
  - usage_summary
