contract_version: v1.1.0
config_version: v1.1.0
policy_version: v1.1.0
freeze_once_before_generation: true
random_seed: 20260829
ratios:
  train: 0.70
  dev: 0.15
  test: 0.15
split_labels: [train, dev, test]

# The connected component formed by all listed relations is indivisible.
grouping:
  hard_group_keys:
    - session_id
    - world_event_id
  near_duplicate:
    enabled: true
    normalized_text: unicode_nfkc_lowercase_collapse_whitespace
    algorithm: char_3gram_jaccard
    similarity_threshold: 0.92
    comparison_scope: all_sessions_same_participant_source_day
    cross_session_time_order: prohibited
    max_gap_seconds: null
  family_integrity: all_family_members_and_referenced_atoms_same_split

requirements:
  source_atom_exactly_one_split: true
  no_shared_world_event_across_splits: true
  no_near_duplicate_source_group_across_splits: true
  no_generation_quality_based_reassignment: true
  test_requires_unseen_intention_cue_combinations: true
