# All paths are relative to this file's directory unless explicitly documented.
contract_version: v1.0.0
config_version: v1.0.0
path_anchor: config_directory
project_root: ../..
benchmark_root: ..
raw_root: ../../raw/EgoLifeCap
transcript_root: ../../raw/EgoLifeCap/Transcript
dense_caption_root: ../../raw/EgoLifeCap/DenseCaption

source_dir: ../source
cues_dir: ../cues
seeds_dir: ../seeds
rules_dir: ../rules
lifelogs_dir: ../lifelogs
benchmark_dir: ../benchmark
audit_dir: ../audit
logs_dir: ../logs
schema_dir: ../schemas
coordination_dir: ../coordination

artifacts:
  source_inventory: ../source/srt_inventory.csv
  raw_srt_segments: ../source/raw_srt_segments.jsonl
  source_atoms: ../source/source_video_atoms.jsonl
  source_split_map: ../source/source_split_map.jsonl
  source_report: ../source/atom_build_report.json
  cue_library: ../cues/cue_library.jsonl
  seed_candidates: ../seeds/reminder_seed_candidates.jsonl
  seed_audit: ../seeds/reminder_seed_audit.csv
  frozen_seeds: ../seeds/reminder_seeds_frozen.jsonl
  rule_bank: ../rules/rule_bank.jsonl
  state_machine_policy: ../rules/state_machine_policy.yaml
  family_specs: ../lifelogs/family_specs.jsonl
  lifelogs: ../lifelogs/lifelogs.jsonl
  counterfactual_pairs: ../lifelogs/counterfactual_pairs.jsonl
  decision_instances: ../benchmark/decision_instances.jsonl
  evidence_sets: ../benchmark/evidence_sets.jsonl
  validation_errors: ../audit/validation_errors.jsonl
  leakage_report: ../audit/leakage_report.json
  final_statistics: ../audit/final_statistics.json

success_markers:
  source_atoms: ../source/SOURCE_ATOMS_SUCCESS.json
  cue_library: ../cues/CUE_LIBRARY_SUCCESS.json
  seed_candidates: ../seeds/SEED_CANDIDATES_SUCCESS.json
  frozen_seeds: ../seeds/SEEDS_FROZEN_SUCCESS.json
  lifelogs: ../lifelogs/LIFELOGS_SUCCESS.json
  decisions: ../benchmark/DECISIONS_SUCCESS.json
  final_validation: ../audit/FINAL_VALIDATION_SUCCESS.json

atomic_write:
  required: true
  temporary_suffix: .tmp
  success_marker_required_fields:
    - artifact_path
    - sha256
    - row_count
    - contract_version
    - config_version
    - schema_versions
    - generated_at
    - upstream_hashes
