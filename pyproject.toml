[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "egopm-bench"
version = "1.0.0"
description = "EgoPM-Bench v1 数据处理前置流水线：Source 建库与 Cue 构造"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.22,<5",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
]

[tool.setuptools]
# 生产目录里既有数据目录也有独立编号脚本，刻意不按 Python 包分发。
packages = []

[tool.pytest.ini_options]
testpaths = ["egopm_bench_v1/tests"]
addopts = "-ra"
python_files = ["test_*.py"]
